<!--html tela login-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!--fonte, css, favicon-->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="../../assets/favicon.ico" type="image/x-icon">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="../../components/global.css">
    <link rel="stylesheet" href="StyleLogin.css">
</head>
<body>
    <div class="main-wrapper">
        <nav class="back-nav">
            <a href="../../index.html" class="btn-back">
                <i data-lucide="arrow-left"></i> Voltar
            </a>
        </nav>

        <header class="header-section">
            <img src="../../assets/logo-lunafit (sem fundo).png" alt="Logo" class="logo-img">
            <h1 class="brand-name">Bem-vinda de volta</h1>
            <p class="tagline">Entre para continuar sua jornada.</p>
        </header>

        <section class="login-card">
            <form id="login-form" action="../App/app.html">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <a href="#" class="forgot-password">Recuperar senha</a>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="signup-link-container">
                Ainda não tem conta? <a href="../cadastro_1/cadastro.html">Cadastre-se</a>
            </div>
        </section>

        <footer class="login-footer">
            <small class="footer-note">🌙 Lunafit • feito para você</small>
        </footer>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
