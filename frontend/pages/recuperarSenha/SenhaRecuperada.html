<!--Tela Senha Recuperada-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>

    <!--Links css, favicon..-->
    <link rel="stylesheet" href="../../components/global.css">
    <link rel="stylesheet" href="SenhaRecuperada.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="shortcut icon" href="../../assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <main class="main-wrapper">
        
        <nav class="back-nav">
            <a href="../../index.html" class="btn-back">
                <i data-lucide="arrow-left"></i> Voltar
            </a>
        </nav>

        <header class="header-section">
            <img src="../../assets/logo-lunafit (sem fundo).png" alt="Logo Lunafit" class="logo-img">
            <h1 class="brand-name">Recuperar senha</h1>
            <p class="tagline">Senha atualizada com sucesso.</p>
        </header>

        <section class="login-card">
            <div class="success-content">
                <div class="icon-container-lucide">
                    <i data-lucide="circle-check" 
                    data-lucide-width="80" 
                    data-lucide-height="80" 
                    data-lucide-stroke-width="1.2"
                    style="color: #810485;"></i>
                </div>

                <p class="instruction-text">Use sua nova senha para entrar.</p>

                <a href="../Login/login.html" class="btn-primary-link">Ir para o login</a>
            </div>
        </section>

        <footer class="footer-note">
            🌙 Lunafit • feito para você
        </footer>

    </main>

    <script>
      lucide.createIcons();
    </script>
</body>
</html>
