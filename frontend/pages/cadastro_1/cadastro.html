<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | LunaFit</title>
    <link rel="shortcut icon" href="../../assets/favicon.ico" type="image/x-icon">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../components/global.css">
    <link rel="stylesheet" href="StyleCadastro.css">
</head>
<body>
    <div class="main-wrapper">
        <nav class="back-nav">
            <a href="../../index.html" class="btn-back">
                <i data-lucide="arrow-left"></i> Voltar
            </a>
        </nav>

        <header class="header-section">
            <img src="../../assets/logo-lunafit (sem fundo).png" alt="Logo LunaFit" class="logo-img">
            <h1 class="brand-name">Crie sua conta</h1>
            <p class="tagline">Comece sua jornada respeitando seu ritmo.</p>
        </header>

        <section class="signup-card">
            <form id="signup-form" action="../App/app.html">
                <div class="input-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" placeholder="Seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="********" required minlength="6">
                </div>

                <button type="submit" class="btn-primary">Criar conta</button>
            </form>

            <div class="login-link-container">
                Já tem conta? <a href="../Login/login.html">Entrar</a>
            </div>
        </section>

        <footer class="signup-footer">
            <small class="footer-note">Lunafit - feito para você</small>
        </footer>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
