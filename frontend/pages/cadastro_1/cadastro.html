<!--html tela cadastro 1-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Cadastro - LunaFit</title>

    <link rel="stylesheet" href="StyleCadastro.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro LunaFit</h1>

        <form id="cadastro-form">

            <input
                type="text"
                id="nome"
                placeholder="Nome"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="number"
                id="idade"
                placeholder="Idade"
                required
            >

            <input
                type="text"
                id="objetivo"
                placeholder="Objetivo"
                required
            >

            <input
                type="text"
                id="nivel"
                placeholder="Nível"
                required
            >

            <input
                type="number"
                id="dia"
                placeholder="Dia última menstruação"
                required
            >

            <input
                type="number"
                id="duracao"
                placeholder="Duração ciclo"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

    </div>

    <script type="module" src="cadastro.js"></script>

</body>
</html>
