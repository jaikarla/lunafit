<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Cadastro</title>

    <!--links, css, favicon-->
    <link rel="shortcut icon" href="../../assets/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="StyleCadastro.css">

    <main class="main-wrapper">
