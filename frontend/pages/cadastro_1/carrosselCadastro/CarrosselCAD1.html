<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="../../../components/global.css">
    <link rel="shortcut icon" href="../../../assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="CarrosselCAD1.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="main-wrapper">
        <header class="onboarding-header">
            <img src="../../../assets/logo-lunafit (sem fundo).png" alt="Logo Lunafit" class="logo-img">
            <h1 class="brand-name">Lunafit</h1>
        </header>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill active"></div> 
                <div class="progress-fill"></div>
                <div class="progress-fill"></div>
                <div class="progress-fill"></div>
                <div class="progress-fill"></div>
            </div>
        </div>

        <section class="onboarding-card">
            <div class="card-header">
                <i data-lucide="sparkles" class="icon-sparkle lucide-icon-fix"></i>
                <h2>Olá, vamos nos conhecer?</h2>
                <p>Comece com o básico para personalizarmos tudo.</p>
            </div>

            <form class="onboarding-form" id="form-inicial">
                <div class="input-group full-width">
                    <label for="nome">Como podemos te chamar?</label>
                    <input type="text" id="nome" placeholder="Seu nome" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" placeholder="25">
                    </div>
                    <div class="input-group">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" placeholder="60">
                    </div>
                    <div class="input-group">
                        <label for="altura">Altura (cm)</label>
                        <input type="number" id="altura" placeholder="165">
                    </div>
                </div>

                <div class="button-container">
                    <a href="CarrosselCAD2.html" class="btn-next" id="btn-continuar-inicial">
                        Continuar <i data-lucide="arrow-right" class="lucide-icon-fix"></i>
                    </a>
                </div>
            </form>
        </section>
    </main>

    <script src="fluxo-cadastro.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
